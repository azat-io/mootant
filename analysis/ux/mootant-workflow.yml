# Draft GitHub Actions workflow for Mootant 0.1.0 (analysis/06-ux-and-agents.md, 6.2).
# Checked locally: actionlint (wasm 2.0.6) has no findings; the --since part was
# replayed on a local remote with a GitHub-style refs/pull/N/merge ref
# (analysis/ux/ci-since-check.txt). Not run on GitHub itself.
name: Mutation testing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mootant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mootant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # sticky comment; read-only for PRs from forks
    steps:
      - uses: actions/checkout@v5
        with:
          # --since needs the base branch and the merge base locally. The
          # default fetch-depth 1 gives "unknown git revision". fetch-depth 2
          # also works for pull_request, but only with --since HEAD^1 (the
          # first parent of GitHub's merge commit is the base branch tip).
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci deletes node_modules, so the verdict cache is restored after it.
      - run: npm ci

      # Verdicts live in node_modules/.cache/mootant/run-v2.json with paths
      # relative to the root; they are reused only with the same Node.js major,
      # OS, arch, lockfile, runner config and Mootant build. Keys are immutable,
      # hence the run id suffix; PRs read the caches of main.
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/mootant
          key: mootant-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            mootant-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-

      - name: Mutation testing of changed lines
        if: github.event_name == 'pull_request'
        run: >-
          npx mootant run src
          --since "origin/${GITHUB_BASE_REF}"
          --threshold 80
          --json > mootant.json

      - name: Mutation testing of the whole project
        if: github.event_name == 'push'
        run: npx mootant run src --threshold 80 --json > mootant.json

      # Save even when the threshold fails the job: the verdicts are still valid.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: node_modules/.cache/mootant
          key: mootant-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      # Mootant 0.1.0 has no GitHub, SARIF or Markdown output; this step
      # converts its JSON. A run that stops early prints no JSON at all.
      - name: Annotations and job summary
        if: always()
        run: |
          if [ -s mootant.json ]; then
            node .github/scripts/mootant-github.mjs mootant.json \
              --summary "$GITHUB_STEP_SUMMARY" --comment comment.md
          else
            echo "::error title=Mootant::The run stopped before writing a report; see the log of the previous step."
          fi

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('comment.md') != ''
        continue-on-error: true # GITHUB_TOKEN is read-only for forks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mootant-report
          path: |
            mootant.json
            .mootant/report.html
          if-no-files-found: ignore
